# 控制契约 —— 可调度任务的 allowlist
# 写法照 acuven-shop 的 .platform/tasks.yaml；格式以控制面仓库 docs/ONBOARD-PROJECT.md 为准。
#
# 默认 deny。未在 tasks 里列出的任务 id 一律拒绝，不做前缀匹配、不做模糊匹配。
#
# 这份文件说「怎么做、能碰什么」；「做什么、先做什么」在 tasks/todo.md 的 planning-v1 块里。
# 两边必须一致：每个 ready 任务都要出现在计划块里，计划块「当前计划」里的每一项都要在这里登记为 ready，
# 否则整个项目 fail closed。
#
# ⚠️ Worker 改不了 .platform/：run 自己的 PR 不能改这份文件。任务合并部署之后，
#    由收尾 PR 把 ready 改成 done，并把它从 planning-v1 块的「当前计划」移出。

# 必须是整数 1。
schema_version: 1
# 与 .platform/project.yaml 的 project_id 相同。
project_id: crm_os
# 必须是 deny。
default: deny

# 每个任务的字段（标 * 的由 Worker 机器校验，不合规则整个任务加载失败）：
#   id *                   符合控制面登记的 task_id_pattern（本项目为 ^CRM-TASK-[0-9]{3}$），全文件唯一
#   title *                一句中文，80 字符内；不用反引号、尖括号、「」『』【】〖〗、链接、路径
#   purpose *              为什么做、做到什么程度、明确不碰什么
#   status *               ready = 可以在 Telegram 发「开启」；done = 已交付；blocked / superseded / cancelled = 不可开始
#   depends_on *           前置任务 id 列表；「当前计划」第一项的依赖必须全部为 done
#   acceptance_criteria *  非空列表，每条一句可验证的标准
#   allowed_change_paths * 本 run 允许改动的文件：仓库根相对的 POSIX 路径，逐个精确匹配；
#                          不能是 .platform/ 下、.git、凭据形状的文件名
#   allowed_commands *     非空列表，只能引用 .platform/commands.yaml 里已有的 id
#   creates_branch *       必须是 true
#   creates_pull_request * 必须是 true（Worker 以 Draft PR 交付，不合并、不直推）
#
# ⚠️ 本仓库公开；title / purpose / acceptance_criteria / allowed_change_paths / allowed_commands 会原样进 PR 正文
#    并过泄漏规则：不写任何 xxx:// 形式的地址、主机名、邮箱地址、IP、绝对路径。
#
# 每个任务的验收标准末尾都带这两条通用约束：
#   - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
#   - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
tasks:
  # 任务三（按 id 接口越权修复）留下的口子：编辑客户时已经校验「能不能把客户分给这个人」，
  # 新建客户和 Excel 导入还没有。权限判断沿用 access_service.may_assign_to，不新增规则。
  # 设计闸门与设计预审：不适用——只补一处已有的权限检查，不收集、存储、展示新的个人数据，不碰钱、状态机、表结构。
  - id: CRM-TASK-001
    title: 新建客户和表格导入时校验负责人分派权限
    purpose: >-
      新建客户接口和表格导入的负责人邮箱列目前能把新客户直接分给任何人，而编辑客户时已经按
      access_service.may_assign_to 校验。把同一个校验补到这两个入口，让新建与编辑的口径一致。
      只改这两个入口；不改 may_assign_to 本身、不改自动分派（路由规则）、不改前端、不改表结构。
    status: done
    depends_on: []
    acceptance_criteria:
      - 新建客户时请求里带了 assigned_to 且 access_service.may_assign_to 判为否，返回与编辑客户越权时相同的 403 响应（FORBIDDEN），不创建客户；不带 assigned_to、或带了且有权分派时行为不变
      - 表格导入里某行的 assigned_to_email 指向导入人无权分派的账号时，该行不导入，并记一条与「账号不存在或已停用」相同字段、相同文案的行错误（不暴露该账号是否存在）；其他行照常导入
      - 表格导入里 assigned_to_email 为空、或指向导入人有权分派的账号时，行为不变；auto_assign 与按策略分派的行为不变
      - 新增测试覆盖：销售给别人建客户被拒、销售给自己建客户成功、经理给本团队成员建客户成功、经理给团队外的人建客户被拒、管理员给任何人建客户成功；导入时越权行被拒且其他行照常导入；每条测试写明守住的是哪一条验收标准
      - 新增测试与已有后端测试由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-001 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改前端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，只补已有的权限检查），不合并、不直推
    allowed_change_paths:
      - backend/app/routers/contacts.py
      - backend/app/services/contact_service.py
      - backend/tests/test_contact_create_assign.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 以下四个来自 2026-10-12 对回复模块的核实（tasks/todo.md「任务七」）。
  # 设计闸门与设计预审：均不适用——004 只让失败如实暴露（失败的消息不再入库，存的个人数据只会更少），
  # 002/003 只在管理员已经看得到的列表上加筛选；都不碰钱、状态机、表结构，文件与验收标准都远低于拆分线。
  - id: CRM-TASK-004
    title: 发送失败或未配置时如实报错，不再把消息记为已发出
    purpose: >-
      收件箱发 WhatsApp 时如果凭据没配，现在会把消息存成已发出并返回成功，实际没有发出；发邮件时 SMTP 没配或发送出错，
      同样存成已发出并返回成功。客服因此以为客户收到了。改成如实返回错误、不保存这条出站消息，前端已有的报错提示会显示出来。
      只改这三处失败路径；不改演示联系人经网关发送的分支（等 WhatsApp 接入方案定了另行处理）、不改前端、不改表结构、
      不改收邮件。
    status: done
    depends_on: []
    acceptance_criteria:
      - 给非演示联系人发 WhatsApp 时，access token 或 phone number id 缺任一项，接口返回 503、错误码 NOT_CONFIGURED，不保存出站消息，也不发起任何外部请求
      - 凭据齐全时发送成功、Graph API 返回非 200 或网络出错的行为都不变（失败仍是 502 API_ERROR 且不保存消息）；演示联系人经网关发送的分支不变
      - 发邮件时 SMTP 主机或用户缺任一项，接口返回 503、错误码 NOT_CONFIGURED，不保存出站消息
      - SMTP 连接、认证或发送任一步出错时，接口返回 502、错误码 API_ERROR，不保存出站消息并记录错误日志；发送成功、以及联系人不存在或没有邮箱时的行为不变
      - 原来断言未配置时仍保存消息的测试改为断言 503 且不入库；新增邮件发送测试覆盖未配置、发送出错、发送成功、没有邮箱四种情况；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-004 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改前端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，只让失败如实暴露），不合并、不直推
    allowed_change_paths:
      - backend/app/services/whatsapp_service.py
      - backend/app/services/email_service.py
      - backend/app/routers/messages.py
      - backend/tests/test_whatsapp_service_send.py
      - backend/tests/test_email_send.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CRM-TASK-002
    title: 客户列表支持只看未分派的客户
    purpose: >-
      负责人为空的客户只有管理员看得到，但混在全部客户里，没有办法单独筛出来。给客户列表接口加 unassigned 参数，
      让管理员能只看这些客户，前端由 CRM-TASK-003 接上。不改任何角色能看到哪些客户的规则（销售、经理仍看不到未分派客户），
      不加计数接口（列表的 total 就是数量）、不改仪表盘、不改前端、不改表结构。
    status: done
    depends_on: []
    acceptance_criteria:
      - 客户列表接口接受 unassigned 参数（0 或 1，默认 0，其他取值返回 422）；为 1 时只返回负责人为空的客户，并与已有的角色过滤、搜索、行业、负责人、归档、排序、分页条件同时生效；返回的 total 是筛选后的数量
      - 不传 unassigned 或传 0 时，列表行为不变
      - 销售和经理传 1 时返回空列表、total 为 0，不报错；同时传 assigned_to 与 unassigned=1 时返回空列表
      - 不改 access_service、不改列表的角色过滤与 demo 排除
      - 新增测试覆盖：管理员传 1 只看到未分派客户且 total 正确；与归档条件同时生效；销售与经理传 1 得到空列表；不传时结果不变；非法取值返回 422；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-002 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改前端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，只在管理员已可见的列表上加筛选），不合并、不直推
    allowed_change_paths:
      - backend/app/routers/contacts.py
      - backend/app/services/contact_service.py
      - backend/tests/test_contact_unassigned.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CRM-TASK-003
    title: 客户页给管理员显示未分派数量和筛选开关
    purpose: >-
      在 CRM-TASK-002 的 unassigned 参数之上，让管理员在客户页直接看到有多少未分派客户、一键只看它们，
      未分派的线索不再无声无息。只对管理员显示；不改后端、不改销售与经理看到的页面、不加新页面或路由。
    status: done
    depends_on:
      - CRM-TASK-002
    acceptance_criteria:
      - 管理员打开客户页时，筛选区显示未分派开关和未分派客户数量（取自 unassigned=1 的列表 total），数量大于 0 时醒目显示；列表每次重新加载时数量一并刷新
      - 打开开关后列表只显示未分派客户并回到第 1 页，关闭后恢复原列表；与搜索、归档切换可以同时使用
      - 销售和经理看不到这个开关，也不发起未分派数量的请求，页面行为不变
      - 新文案同时加在 en 与 zh 的 contacts 命名空间，不写硬编码文字
      - 前端类型检查与构建由 PR 的必需 CI 检查 frontend 执行并通过（Worker 沙箱不跑 npm）
      - tasks/todo.md 新增 CRM-TASK-003 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不改后端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，纯前端筛选），不合并、不直推
    allowed_change_paths:
      - frontend/src/pages/Contacts/index.tsx
      - frontend/src/services/contacts.ts
      - frontend/src/locales/en/contacts.json
      - frontend/src/locales/zh/contacts.json
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 以下六个是 ai_chatbot_demo 会话事件第 1 阶段「入站进 CRM」，设计与接口契约见 docs/chatbot-events.md
  # （Kelvin 2026-10-12 批准，设计闸门引用 kelvinpang90/acuven_crm_demo#17）。拆分照设计第七节（007 按 Kelvin 2026-10-12 的决定拆出 011）：一个任务一层，依赖串起来。
  # 设计闸门：六个都适用——006/009 改表结构与存量数据，007 改所有保存号码的入口（个人数据），
  # 011 是接管与送达两个只升不降的状态规则、并存储 BSUID 与资料名，
  # 008 是接收个人数据的内部接口与验签，010 展示经 chatbot 进来的对话与号码冲突。
  # 设计预审的完整输出在 tasks/todo.md「登记 CRM-TASK-006 至 011」；预审报出的设计缺陷按设计第九节补充修正
  # （第九节随本登记 PR 待 Kelvin 批准），其余发现写进了各任务的验收标准或说明了为什么不成立。
  # 与 ai_chatbot_demo 已实现推送（其任务 40.1、40.2）的对齐点写进了 008 的验收标准：密钥按字符串的 UTF-8 字节进 HMAC、
  # 响应体顶层只有 result、ai_reply 的 bot_id 可为空。
  - id: CRM-TASK-006
    title: 会话事件第1阶段的表结构迁移与模型
    purpose: >-
      按 docs/chatbot-events.md 第六节给 contacts 与 messages 加列，让后续任务能存 BSUID、接管状态、消息来源与送达状态。
      一次 Alembic 迁移加列加索引，模型同步。只做表结构：不改任何服务、接口、前端，不改存量数据
      （存量号码规范化是 CRM-TASK-009）。
    status: ready
    depends_on: []
    acceptance_criteria:
      - contacts 新增 whatsapp_bsuid（字符串 128，可空，唯一索引，多个空值互不冲突）、wa_handover_active（布尔，非空，默认 false，带数据库默认值让存量行取 false）、wa_handover_expires_at 与 wa_handover_updated_at（时间，可空，存 UTC）；phone 列加普通索引
      - messages 新增 author_kind（枚举 customer、ai、console、agent，可空）、bot_id（字符串 50，可空）、delivery_status（枚举 sent、delivered、read、failed，可空）、delivery_error（字符串 300，可空）
      - 新增迁移 012，down_revision 为 011：upgrade 只加上面的列与索引、不改存量数据；downgrade 按相反顺序删掉它们回到 011 的形状；模型与迁移逐列一致
      - 模型只加字段不加行为；不改任何服务、路由、schema、前端
      - 新增测试：用 Alembic 的 Operations 在内存 SQLite 上对只含 id 与 phone 的最小 contacts 表、只含 id 的最小 messages 表执行 012 的 upgrade 再 downgrade，断言新列与索引先出现后消失；按模型建表后，两个联系人用同一个 whatsapp_bsuid 插入失败、两个空值插入成功；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-006 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#17），不合并、不直推
    allowed_change_paths:
      - backend/alembic/versions/012_add_chatbot_event_fields.py
      - backend/app/models/contact.py
      - backend/app/models/message.py
      - backend/tests/test_migration_012.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  # 007 与 011 原是设计第七节的一个 007，验收标准 10 条超过拆分线，Kelvin 2026-10-12 定拆成两个：
  # 007 做号码规范化、各保存入口与冲突查询，011 做第五节的事件处理规则（依赖 006 的新列与 007 的规范化函数）。
  - id: CRM-TASK-007
    title: 号码规范化、各保存入口统一规范化与号码冲突查询
    purpose: >-
      实现 docs/chatbot-events.md 第三节与第九节第 2、3 条的号码规范化：一个函数、一处定义，联系人新建、编辑、表格导入与
      AutoCount 同步保存号码前都用它；再加号码冲突查询，供 CRM-TASK-008 返回 phone_conflict。CRM 自己的 Meta webhook 与网关入站
      （第 2 阶段删除）只把按号码找联系人改成取最早创建的一条（设计 P2），其余不动。不处理会话事件（CRM-TASK-011）、
      不加接口、不改表结构、不迁移存量号码（CRM-TASK-009）、不改前端。
    status: ready
    depends_on: []
    acceptance_criteria:
      - 新增号码规范化函数，按设计第三节与第九节第 3 条：先去掉非数字，对剩下的数字去掉开头的 00，恰好一个开头的 0 换成 60，仍以 0 开头或不在 8 到 15 位的无法规范化：+60 12-345 6789、012-345 6789、0060123456789、+0060123456789、60123456789 都得到 60123456789；0000123456789、不足 8 位、超过 15 位、空值或没有数字的返回无法规范化；规范化结果再规范化一次不变
      - 联系人新建、编辑、表格导入与 AutoCount 客户同步保存号码前都经这个函数：能规范化的存规范化结果，无法规范化的原样保存，不带号码时行为不变，AutoCount 同步拉回同一个号码时不产生改动
      - 新增号码冲突查询：给定一组号码，返回其中被两个及以上未删除联系人共用的号码（只看能规范化的号码，空值、空串与无法规范化的原文不算冲突），联系人改号或删除后不再算冲突
      - 现有 Meta webhook 与网关入站按号码找联系人时取最早创建的一条（创建时间相同按 id 取最小），多个联系人同号码时不报错；这两个入口的其余行为不变

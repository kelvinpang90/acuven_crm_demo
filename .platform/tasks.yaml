  - id: CRM-TASK-035
    title: 商机AI下一步建议的快照组装与停滞天数计算
    purpose: >-
      按 docs/deal-next-step.md 第三节、4.2 与 4.3 节，组装发给模型的商机快照，并由 CRM 算出多少天没有进展、在当前阶段多少天与是否停滞。
      复用 CRM-TASK-027 的 owner_scope 与客户摘要快照的取法。只做业务规则层的快照函数：不调 AI、不写审计、不加接口、不改前端、不加表与迁移；
      测试不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-031
    acceptance_criteria:
      - 新文件 deal_next_step_service 新增 build_deal_snapshot(db, *, user, deal, contact, now)，deal 与 contact 是调用方已读出的未删除记录，now 是带时区的 UTC 时间（库里不带时区的时间按 UTC 处理）；返回的字典恰好含 deal、contact、activities、messages、open_tasks、documents、truncated 七个键；不调 AI、不写审计、不写库；新增常量 STALL_DAYS 等于 7
      - deal 块恰好含 title（为空为空串，截到 100 字）、status、priority、amount（两位小数的字符串）、created_on（created_at 的日期，YYYY-MM-DD）、days_in_status、idle_days、stalled；contact 块恰好含 name、company、industry、tags、notes，标签与备注的截断与客户摘要相同（标签最多 10 个、每个 30 字，备注 500 字）；快照里没有任何 id、电话、邮箱、地址、BSUID、AutoCount 客户代码、单号与员工姓名
      - 停滞（设计 4.3）：天数都是 now 减去某个时间后按整天向下取整、负数按 0；idle_days 取这个商机最新一条跟进记录的跟进时间（任何类型，含 status change）、这个联系人最新一条消息的创建时间（不分方向）、商机创建时间三者里最晚的一个；days_in_status 取这个商机最新一条 status change 跟进记录的跟进时间，没有则取商机创建时间；stalled 为商机状态是 lead、following、negotiating 之一且 idle_days 不小于 STALL_DAYS
      - activities 块：只取这个商机的跟进记录（含 status change），按跟进时间、同一时间按 id 取最近 15 条，从旧到新输出，每条恰好含 at（UTC 到秒带 Z）、type、content（为空为空串，截到 300 字）；messages 块：这个联系人的消息最近 10 条，取法、顺序与条目格式与 build_contact_snapshot 的 messages 相同；open_tasks 与 documents 块：取法与条目格式与 build_contact_snapshot 相同（本人可见即 owner_scope、未完成、前 5 个；单据前 5 张）；可以把 contact_summary_service 里同样的取法抽成共用函数，客户摘要的行为不变
      - 16 KiB 与 truncated：快照按紧凑 JSON、不转义非 ASCII 的 UTF-8 计，超过 16384 字节时先从最旧的消息开始丢、至少留 1 条，仍超再从最旧的跟进记录开始丢、至少留 1 条，仍超照常返回；任何一处截断、任一块条数超过上限没取全、或因 16 KiB 丢了记录，truncated 为真，否则为假
      - 新测试文件 test_deal_next_step_snapshot 覆盖下列用例（一个用例可以是一个参数化测试，now 固定）：1 deal 块：标题为空为空串、101 字截到 100 且 truncated 为真、amount 两位小数字符串、created_on 为日期、键恰好八个；contact 块键恰好五个；2 idle_days：只有商机创建于 10 天前为 10；最新跟进 3 天前为 3；最新入站消息 2 天前为 2、最新出站消息 2 天前也为 2；同一联系人别的商机的跟进与别的联系人的消息不算；跟进时间在将来为 0；6 天 23 小时为 6；3 days_in_status：没有 status change 时按创建时间；两条 status change 取较新的；更新的 phone 跟进不影响；4 stalled：following、lead、negotiating 且 idle_days 为 7 为真，following 且 6 为假，won、lost 且 30 为假
      - 测试续：5 activities：别的商机的跟进不进来；16 条只取最近 15 条且从旧到新，同一跟进时间按 id；content 为空输出空串、301 字截到 300 且 truncated 为真；6 messages：11 条只取最近 10 条且从旧到新，别的联系人的消息不进来；7 open_tasks：销售请求时别人名下的与已完成的不进来，6 条只取 5 条；documents 6 张只取 5 张；8 16 KiB：超大时先丢最旧的消息、只剩 1 条后再丢最旧的跟进、各剩 1 条仍超时照常返回，三种情况 truncated 都为真；小快照 truncated 为假。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

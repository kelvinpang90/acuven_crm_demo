  - id: CRM-TASK-014
    title: 未确认送出的重试、agent_reply 事件规则与交还 AI 的调用
    purpose: >-
      按 docs/chatbot-replies.md 第六节「重试」「agent_reply 事件」「交还 AI」，在 CRM-TASK-013 的发送服务上补齐三条业务规则：
      未确认送出的消息用同一个幂等键重试且重试失败不删，chatbot 推回的 agent_reply 事件回填 wa_message_id，经 chatbot 交还 AI 并写入接管状态。
      只做业务规则层，由 CRM-TASK-015 的接口调用：不加接口与事件类型校验、不改表结构、不改前端。
    status: done
    depends_on:
      - CRM-TASK-013
    acceptance_criteria:
      - 重试只对 author_kind 为 agent 的消息，其他返回不可重试；external_id 已非空（其间已确认）直接返回已发出与这条消息、不调用 chatbot；否则先查创建时间：创建不足 45 秒返回 IN_PROGRESS（第一次发送可能还在途中，30 秒总时限加余量），当前时间不早于创建时间加 24 小时返回 RETRY_EXPIRED，两者先于其他检查；联系人不存在或已软删除返回 NOT_FOUND、不调用 chatbot；再按 CRM-TASK-013 查窗口与配置；用同一个 request_id（消息 id）、同样的正文、发给这条消息存的收件人（第一次发送时的规范化号码，不换成联系人现在的号码）、visitor 的 bsuid 取联系人现在的 BSUID（可为空）、agent 为原发送人 sent_by（用户已不存在时 name 用这个 id）调用 chatbot；已发出按 CRM-TASK-013 的条件更新与接管写入处理；其他任何结果都保留这条消息，只返回结果类别与错误信息
      - agent_reply 事件处理入口只接受已校验的普通参数（crm_message_id、wa_message_id、body）：按 crm_message_id 找消息，找不到或不是 agent 返回 ignored；external_id 已等于 wa_message_id 返回 duplicate；external_id 为空时若别的消息已占用这个 wa_message_id 返回 duplicate，否则写入 external_id，delivery_status 为空时写 sent，返回 stored；external_id 是另一个值返回 ignored 并打 WARNING；不新建联系人、不改接管、不改正文
      - 交还 AI 按设计第五节签名调用 chatbot 交还接口（总时限 30 秒），visitor 带联系人的规范化号码（号码无法规范化时为空）与 BSUID；两个都为空返回 NO_IDENTITY；联系人不存在或已删除返回 NOT_FOUND、未配置返回 NOT_CONFIGURED，都不调用；ended 且带合法的 handover 时经 CRM-TASK-013 的写入函数写入接管（严格晚于）；not_active 不改；chatbot 其他错误、超时或传输失败返回失败、不改；200 但不合契约的返回失败、不改、打 ERROR，不合契约指 result 既不是 ended 也不是 not_active，或 ended 却没有合法的 handover；合法的 handover 指 occurred_at 为带时区的时间、active 为 false、expires_at 为空（设计第五节），任一项不符都不合法；返回联系人当前接管三项；不存消息、不记活动
      - 新增测试一（重试与 agent_reply），打桩 chatbot，测试以下面列出的用例为准，不要求覆盖清单以外的分支：重试（1）不是 agent 的消息返回不可重试（2）external_id 已非空返回已发出、不调用（3）创建不足 45 秒返回 IN_PROGRESS、满 24 小时返回 RETRY_EXPIRED，两者在联系人已删除时也先返回（4）联系人不存在或已软删除返回 NOT_FOUND（5）窗口关闭与未配置各返回对应结果，（3）至（5）都断言没有调用 chatbot（6）核对请求体：request_id 为消息 id、正文不变、phone 为消息存的收件人而不是联系人现在的号码、bsuid 为联系人现在的值且为空时发 null、agent 为 sent_by 且用户不存在时 name 为这个 id（7）已发出时写入 external_id 与 sent（8）rejected、401、超时、传输失败、200 但结果不合契约各一例，消息仍在且 external_id 与 delivery_status 不变；agent_reply（9）找不到或不是 agent 返回 ignored（10）external_id 已等于 wa_message_id、别的消息已占用这个 wa_message_id 各返回 duplicate（11）external_id 为空时写入并返回 stored，delivery_status 为空写 sent、已有值不改（12）external_id 是另一个值返回 ignored、用 caplog 断言 WARNING、external_id 不变
      - 新增测试二（交还 AI），打桩 chatbot，测试以下面列出的用例为准，不要求覆盖清单以外的分支：（1）核对请求路径为交还接口、visitor 的 phone 为规范化号码、bsuid 为联系人的值（2）号码无法规范化但有 BSUID 时 phone 为 null 且照样调用（3）NO_IDENTITY、NOT_FOUND、NOT_CONFIGURED 各一例且不调用（4）ended 且 occurred_at 晚于已存时间时写入、与已存时间同一秒时不写（5）not_active 不改（6）502、超时、传输失败各一例返回失败且不改（7）200 但 result 未知、ended 缺 handover、ended 的 handover 为 active true、ended 的 handover 的 expires_at 非空各一例，返回失败、不改且用 caplog 断言 ERROR，其中 active true 那例的 occurred_at 晚于已存时间；两组测试合起来对应设计第十一节例 3 的事件部分、例 4、例 8、例 9；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

  - id: CRM-TASK-022
    title: 收件箱AI辅助的调用客户端、会话快照组装与审计写入
    purpose: >-
      按 docs/inbox-ai-assist.md 第 4.1、4.4 节与第八节第 3 条，新建调用 Billing Hub AI 模块 POST /v1/messages 的客户端模块（组请求、鉴权头、超时、三类结果），
      以及从库里组装发给模型的会话快照、写 ai_requests 审计记录的业务函数。只做业务规则层：不写三个功能的提示词与 schema（CRM-TASK-023）、
      不加接口、不改前端；AI 模块尚未上线，测试一律打桩 HTTP，不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-021
      - CRM-TASK-013
    acceptance_criteria:
      - 配置类新增 AI_API_BASE_URL、AI_CLIENT_ID、AI_CLIENT_TOKEN、AI_MODEL 四项，默认空，任一为空即未配置；客户端提供判断是否已配置的函数，未配置时不发请求、直接返回未配置；DEPLOY.md 的环境变量示例加这四项空值与一句说明（不写真实值、地址与主机名）
      - 客户端按设计 4.1 与第十一节组请求：POST 基地址加 /v1/messages，请求头 X-Acuven-Client-Id 与 Authorization Bearer，请求体只有 feature、model、system、messages、max_tokens、output_config（format 为 json_schema 与调用方给的 schema，effort 为 low）；序列化后超过 64 KiB 的不发、按 AI 出错返回；总时限 50 秒（短于 nginx 的 60 秒）；不自动重试
      - 结果三类：200 且 stop_reason 为 end_turn、响应的 text 能解析成 JSON 对象为成功（返回解析后的对象与响应体里的 request_id）；200 但 stop_reason 为其他值（含 refusal、max_tokens）或解析失败，以及 401、403、413、422 与其余未列出的状态码为 AI 出错；429、502、503、504、超时、连接失败为暂时不可用；日志只记功能标签、状态码、request_id 与结果类别，不记请求体、快照与模型输出
      - 快照按设计 4.4 与第十一节组装（as_of 不在快照里，由 CRM-TASK-023 放进请求）：联系人的名字、公司、行业、标签（最多 10 个、每个截到 30 字）、备注（截到 500 字），未删除且状态不是 won 或 lost 的商机按更新时间、同一时间按 id 取最近 5 个（标题截到 100 字、状态、金额），接管状态（active 取有效状态即标着接管中且到期时间晚于现在，非有效时 expires_at 为 null，始终输出）；消息取最近 40 条（按创建时间、同一时间按 id），按时间从旧到新排列，每条正文不分渠道截到 2000 字，邮件另带主题（截到 200 字）；整个快照按紧凑 JSON（分隔符不带空格、不转义非 ASCII）的 UTF-8 字节超过 16 KiB 时从最旧的消息开始丢，至少保留最新一条；只剩最新一条仍超 16 KiB 时（字段按字符数截取，emoji 每字 4 字节、控制字符转义后 6 字节，可能超出）照常保留并发出、不报错（超出本身不使 truncated 为真），硬上限由客户端的 64 KiB 检查负责（设计第十三节第 1 条）；客户端判断 64 KiB 用同一种序列化；以上任一处截断或丢弃时 truncated 为真；不放联系人 id、电话、邮箱、BSUID；author_kind 为空的按方向推断为 customer 或 agent；只有渠道为 whatsapp 的出站消息带 delivery：存的 author_kind 为 agent 且 external_id 为空时，创建不足 45 秒为 sending、否则为 unconfirmed，其余取已存的送达状态，没有状态时不带这个键
      - 审计写入函数按设计 4.2 写一行 ai_requests（user_id、contact_id、feature、request_id、outcome、created_at），只存这些
      - 新增测试：打桩 HTTP 逐条覆盖请求形状与请求头、未配置不发请求、64 KiB 上限、三类结果的每个分支、日志不含正文；快照的字段、截断、40 条与 16 KiB 上限（含只剩最新一条仍超 16 KiB 时照常保留）、推断与 delivery 取值；审计写入；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-022 记录段（做了什么、偏离了什么、验证到什么程度）；偏离段只列两类、每条一句：与验收标准或设计文档不一致的做法，以及验收标准没有要求、但改变了现有接口或页面行为的改动；验收标准要求的改动与重构、命名、格式调整不算偏离，没有就写无；偏离段漏列只算非阻塞意见，除非漏列的改动本身违反某条验收标准（那时按那一条判）；验证段只写测试由 PR 的必需检查 backend 执行、检查结果由 Worker 和 CI 记录不写在这里，不写任何检查是否运行或通过；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改接口与前端；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#34），不合并、不直推
    allowed_change_paths:

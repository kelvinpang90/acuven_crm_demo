  - id: CRM-TASK-011
    title: 会话事件的处理规则，找联系人、消息入库、接管与送达状态
    purpose: >-
      实现 docs/chatbot-events.md 第五节与第九节第 1、4 条对五种事件的处理：找联系人（必要时新建并指派、建 lead 商机）、
      消息按 wa_message_id 去重入库、接管状态按事件时间更新、送达状态只升不降。只做业务规则层，入口只收已校验的普通参数，
      由 CRM-TASK-008 的接口调用。不加接口与验签、不改表结构、不改号码规范化与各保存入口（CRM-TASK-007）、不改前端。
    status: ready
    depends_on:
      - CRM-TASK-006
      - CRM-TASK-007
    acceptance_criteria:
      - 消息类事件按设计第五节找联系人（事件里的号码一律先用 CRM-TASK-007 的函数规范化，联系人号码与收发件人字段都存规范化结果；无法规范化的号码由 CRM-TASK-008 拒收，处理入口遇到时按没有号码处理）：先按规范化号码找未删除的联系人，多个取最早创建的（创建时间相同按 id 取最小），该联系人没有 BSUID 且这个 BSUID 没被别的未删除联系人占用时补上；号码没找到再按 BSUID 找，找到且它没有号码时补上号码；号码无法规范化又没有 BSUID 时返回 ignored、不改数据；都没找到就新建（名字依次取资料名、号码、BSUID，截断到 100 字符；is_gateway 为 false；经 assign_contact 指派；建一条 lead 商机）；已有联系人的名字不被资料名覆盖；按第九节第 1 条，要用的 BSUID 只被已软删除的联系人占着时，先把它从那些联系人身上清掉再用，不因唯一索引报错
      - 消息类事件按 wa_message_id 去重，已存在返回 duplicate 且不改任何数据；customer_message 存为未读的入站消息、author_kind 为 customer；ai_reply 存为已读的出站消息、author_kind 为 ai、记 bot_id（可为空）；console_reply 存为已读的出站消息、author_kind 为 console；渠道为 whatsapp，负责人取联系人当前负责人，访客一侧填号码（没有号码填 BSUID）、chatbot 一侧填 ai_chatbot_demo，消息时间取事件的 occurred_at（转成无时区的 UTC 存储）；成功返回 stored
      - handover_changed 只找联系人，不新建、不补 BSUID 或号码、不清已删除联系人的 BSUID（找不到返回 ignored）；occurred_at 早于联系人已存的接管更新时间时返回 ignored 且不改数据，否则写入是否接管、到期时间（结束接管时为空）与更新时间，返回 stored
      - delivery_status 只更新 external_id 等于 wa_message_id 的那条消息（找不到返回 ignored）；只升不降：sent 小于 delivered 小于 read，failed 只能覆盖空值、sent、delivered，已是 failed 的不再改变，同一状态重复到达也不算升级，不满足时返回 ignored 且不改数据；failed 时把错误码与标题以一个空格相连存进 delivery_error（只有一个就只存它，都没有存空）并截断到 300 字符，其他状态不改 delivery_error

    title: 经 chatbot 发出客服回复的发送服务，含窗口校验与结果不明的处理
    purpose: >-
      按 docs/chatbot-replies.md 第五节与第六节「发送」第 2、3、5 至 8 条、「接管写入」，新建 CRM 经 ai_chatbot_demo 内部发送接口发出客服回复的服务：
      校验号码、24 小时窗口与配置，先存未确认的出站消息再签名调用，按已发出、明确没发出、结果不明三类处理，并写入响应带回的接管状态。
      只做业务规则层，由 CRM-TASK-015 的接口调用：不加接口、不改归属校验与正文长度校验（接口层）、不做重试与交还（CRM-TASK-014）、
      不改表结构、不改前端、不删旧的发送代码（CRM-TASK-017）；不写任何真实密钥与地址。
    status: ready
    depends_on:
      - CRM-TASK-012
      - CRM-TASK-011
      - CRM-TASK-008
    acceptance_criteria:
      - 配置类新增 CHATBOT_SEND_URL 与 CHATBOT_SEND_SECRET，默认空，任一为空按未配置处理；注释写明密钥与 chatbot 一侧 CRM_SEND_SECRET 同值、必须与 CHATBOT_EVENTS_SECRET 不同值；请求按设计第五节签名（请求头 X-Acuven-Timestamp 为 Unix 秒、X-Acuven-Signature 为 sha256= 接十六进制，HMAC-SHA256，密钥是字符串的 UTF-8 字节，被签内容是时间戳与一个点的字节再接原始请求体字节），请求体为 request_id、visitor 的 phone 与 bsuid、text、agent 的 id 与 name，总时限 30 秒
      - 发送前按第六节校验，任一不过就返回对应结果、不存消息、不调用 chatbot：联系人号码不能被 normalize_phone 规范化为 NO_PHONE；该联系人最后一条渠道为 whatsapp 的入站消息时间不在 24 小时内（含没有入站消息）为 WINDOW_CLOSED 并带窗口关闭时间；未配置为 NOT_CONFIGURED
      - 通过后先存并提交一条消息再调用 chatbot：新 UUID 作 id 与 request_id，渠道 whatsapp、出站、author_kind 为 agent、sent_by 为当前用户、负责人取联系人当前负责人、发件人 ai_chatbot_demo、收件人为规范化号码、已读、external_id 与 delivery_status 为空；agent 的 name 取用户名字
      - 按第六节第 8 条分三类：200 为已发出；502 rejected、401、422、503、连接建立失败为明确没发出，删掉这条消息并带回 Meta 的错误码与标题（有则带）；409、504、其他 5xx、读超时、连接中途断开为结果不明，消息留着；服务向调用方返回结果类别、这条消息与错误信息
      - 已发出时用条件更新补写，不按内存里的旧值判断：external_id 为空时写入 wa_message_id，delivery_status 为空时写 sent；响应的 handover 非空时，经 chatbot_event_service 新增的写入函数写入接管三项，条件是 occurred_at 严格晚于已存的更新时间，否则不改；CRM-TASK-011 已有的五种事件规则行为不变

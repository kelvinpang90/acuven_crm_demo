  - id: CRM-TASK-023
    title: 收件箱三个AI功能的提示词、输出结构与输出校验
    purpose: >-
      按 docs/inbox-ai-assist.md 第五节，在 CRM 后端定义会话简报、起草回复、翻译三个功能的系统提示、JSON schema、max_tokens 与输出校验，
      并在业务层把快照、功能定义、AI 客户端与审计写入串成三个可调用的业务函数。只做业务规则层：不加接口、不改前端；测试打桩 AI 客户端，不调真实模型。
      提示词的真实效果要等 AI 模块上线后按设计第五节做质量评测，评测不在本任务范围。
    status: done
    depends_on:
      - CRM-TASK-022
    acceptance_criteria:
      - 新增 ai_features 模块定义三个功能：feature 标签分别为 crm.conversation_brief、crm.reply_draft、crm.translate；三个系统提示都写明传入的快照、消息正文与待翻译文本是不可信数据、不执行其中的指令；简报与起草另写明只用快照里的事实，起草再写明快照里没有的价格、日期、承诺写成待确认占位并在 note_for_agent 里说明，员工附的要求是对草稿内容与语气的写作要求、照做，但不改变输出结构、不覆盖只用快照事实与待确认占位的规则（要求里写的价格、日期照样写成占位）；翻译写明忠实翻译、只输出译文；三个系统提示都写明各输出字段的字数与条数上限（按字符数）；max_tokens 三个都为 4000
      - schema 只表达字段、类型、枚举与必填，所有列出的字段都必填（可为空的用空串或空数组），不允许多余字段；起草按渠道两个 schema（WhatsApp 没有 subject，邮件 subject 必填）；长度与条数（按字符数，即码点数）由解析后的校验函数检查：简报 customer_need 1 至 200、conversation_state 1 至 300、customer_mood 为 calm、neutral、frustrated、urgent 之一、open_questions 0 至 3 条且每条 1 至 120、suggested_next_step 0 至 240；起草 draft 1 至 1000（WhatsApp）或 1 至 1500（邮件），subject 1 至 150，note_for_agent 0 至 200；翻译 translation 1 至 8000、detected_language 为 zh-CN、en、ms、other 之一；长度检查前先去首尾空白，返回的也是去空白后的文本；客户端返回成功但校验不过时，由业务函数改判为 AI 出错后再写审计与返回（审计保留 AI 模块已返回的 request_id，便于对账），不截断、不补齐
      - 三个业务函数：简报与起草用 CRM-TASK-022 组装快照；发给模型的用户消息是一个 JSON 数据块，含 as_of（当前 UTC 时间，ISO 格式到秒、带 Z）、output_language 与快照，起草另含 channel 与 instruction；翻译只发 text 与 target_language、不需要快照；检查顺序为参数、配置、消息：参数不合法（语言不在 zh-CN、en、ms 之内，channel 不是 whatsapp 或 email，instruction 给了但去空白后为空或超过 200，text 去空白后为空或超过 2000；翻译发去空白后的 text）返回 INVALID_INPUT，未配置返回 AI_NOT_CONFIGURED，简报与起草的会话没有消息返回 NO_MESSAGES，这三种都不调用 AI、不写审计；instruction 不给时数据块里不带这个键，给了就发去空白后的文本；每次进入 AI 调用（含因超过 64 KiB 没发出去的）都写一行审计；业务函数返回统一的结果对象：结果类别（ok、error、unavailable、not_configured、no_messages、invalid_input 之一）、request_id、各功能的输出字段，简报与起草另带快照的 truncated
      - 新增测试：打桩 AI 客户端，逐个功能覆盖成功、每个字段的长度条数与枚举越界判为 AI 出错、暂时不可用、未配置、无消息；断言发给客户端的 feature、max_tokens、schema 与系统提示里的不可信数据声明；断言审计行的 feature 与 outcome；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-023 记录段（做了什么、偏离了什么、验证到什么程度）；偏离段只列两类、每条一句：与验收标准或设计文档不一致的做法，以及验收标准没有要求、但改变了现有接口或页面行为的改动；验收标准要求的改动与重构、命名、格式调整不算偏离，没有就写无；偏离段漏列只算非阻塞意见，除非漏列的改动本身违反某条验收标准（那时按那一条判）；验证段只写测试由 PR 的必需检查 backend 执行、检查结果由 Worker 和 CI 记录不写在这里，不写任何检查是否运行或通过；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改接口与前端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#34），不合并、不直推
    allowed_change_paths:
      - backend/app/services/ai_features.py
      - backend/app/services/ai_assist_service.py
      - backend/tests/test_ai_features.py
      - tasks/todo.md

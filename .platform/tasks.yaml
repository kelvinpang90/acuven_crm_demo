    status: done
    depends_on: []
    acceptance_criteria:
      - 新文件 dashboard_insight_service 新增 build_team_snapshot(db, *, manager, now)，manager 是调用方已读出的用户，now 是带时区的 UTC 时间（库里不带时区的时间按 UTC 处理）；返回的字典恰好含 period、team、members、truncated 四个键；不调 AI、不写审计、不写库；不导入也不修改 dashboard_service，不读写 is_gateway、不用 demo_scope
      - 团队与口径：团队是 manager 本人加 manager_id 等于他的全部用户；商机只算未删除的、按 assigned_to 归人；月份是 now 所在的 UTC 自然月，上月是它的前一个月（1 月的上月是上一年 12 月）；period 恰好含 month（YYYY-MM）、as_of（now 的日期 YYYY-MM-DD）、day_of_month、days_in_month
      - 每人每月的数：won_amount 与 won_count 为 status 是 won 且 won_at 落在该月的商机金额合计与单数；target_amount 为该人该月 sales_targets 的 target_amount 合计，没有为 0；target_rate 为 won_amount 除以 target_amount 乘 100 四舍五入到一位小数，target_amount 为 0 时为 null；created_count 为 created_at 落在该月的商机数，created_won_count 为其中现在 status 是 won 的数；open_deals 为现在 status 是 lead、following、negotiating 的商机，三个状态各给 count 与 amount，不分月
      - members：每人恰好含 name、is_manager（manager 本人为真）、this_month（won_amount、won_count、target_amount、target_rate、created_count、created_won_count）、last_month（won_amount、won_count、target_amount、target_rate）、open_deals；不放 id、邮箱、头像；包括本月没有任何数字的人；is_active 为假的用户只在本月或上月 won_count 或 created_count 大于 0、或 open_deals 任一状态 count 大于 0 时才放；按本月 won_amount 从高到低、同额按 name 升序，最多 30 人，超过时 truncated 为真，否则为假
      - team：恰好含 this_month 与 last_month（各含 won_amount、won_count、target_amount、target_rate、created_count、created_won_count、win_rate）、open_deals、avg_sales_cycle_days、remaining_to_target；数量与金额都是团队全部成员（含没放进 members 的停用账号与第 30 人以后的人）对应数相加，target_rate 按合计重算；win_rate 为 created_won_count 除以 created_count 乘 100 四舍五入到一位小数，created_count 为 0 时为 null；remaining_to_target 为 target_amount 减 won_amount、小于 0 按 0，target_amount 为 0 时为 null；avg_sales_cycle_days 为 won_at 在 now 之前 90 天内的团队赢单，每单 won_at 的日期减 created_at 的日期的天数的平均，四舍五入到一位小数，没有为 null，在 Python 里算、不用数据库的日期差函数
      - 格式：金额一律为两位小数的字符串（含 0 为 0.00），比率与平均为一位小数的数字或 null，单数为整数
      - 新测试文件 test_dashboard_insight_snapshot 覆盖下列用例（now 固定）：1 顶层四个键、period 四个值，now 为 1 月 3 日时上月为上一年 12 月；2 团队：别的经理的下属与他们的商机不进来，manager 本人进来且 is_manager 为真；已删除的商机不算；3 月份边界：won_at 为本月 1 日 0 点算本月、上月最后一秒算上月；created_at 同理；4 目标：两条目标相加；没设目标时 target_rate 与 remaining_to_target 为 null，团队目标为 0 时 team 的两个值也为 null；成交超过目标时 remaining_to_target 为 0.00；5 win_rate：本月新建 3 单其中 1 单现已赢单为 33.3，没有新建为 null；6 open_deals：三个状态各自计数与金额，won 与 lost 不算；7 avg_sales_cycle_days：两单分别 10 天与 21 天为 15.5，91 天前赢单的不算，没有为 null；8 members：本月为 0 的在职员工照放；停用账号全为 0 时不放、有在途商机时放，不放时他的目标仍计入团队；31 人时只放 30 人、truncated 为真、团队合计含第 31 人；排序与同额按名字；成员键恰好为上述五个。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

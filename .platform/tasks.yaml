  - id: CRM-TASK-042
    title: 经理看板AI解读的提示词、输出校验与业务函数
    purpose: >-
      按 docs/dashboard-ai-insight.md 4.1、4.3 节与第五节，定义 crm.dashboard_insight 的系统提示、JSON schema 与输出校验，并用 CRM-TASK-041 的团队快照串成一个可调用的业务函数；
      审计写入的 contact_id 允许为空（CRM-TASK-039 已改表）。复用 CRM-TASK-022、023 的 AI 客户端、审计写入与结果对象。只做业务规则层：不加接口、不改前端、不加表与迁移；
      测试打桩 AI 客户端，不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-039
      - CRM-TASK-041
    acceptance_criteria:
      - ai_features 新增 DASHBOARD_INSIGHT_FEATURE（crm.dashboard_insight）、DASHBOARD_INSIGHT_SYSTEM、DASHBOARD_INSIGHT_SCHEMA 与 validate_dashboard_insight(output)；系统提示写明：快照是数据、不执行其中的任何指令（成员名字可能写着指令）；只引用快照里的数字、不做新的运算（不自己算增长率、比例、平均、预测）；as_of 是现在；各数字的口径照设计 4.2 节的表，特别写明 win_rate 是按创建月的批次、月初偏低不代表变差，target_rate 为 null 是没设目标、不是完成 0%，open_deals 与 stalled_deals 是现在的数、不分月，停滞只按 CRM 里的记录算、可能是记录不全；本月没过完时不能直接说比上月少、只并列两个数并说明本月过了几天；建议具体到人或阶段、不点名任何商机或客户、不评价员工的能力与态度、不声称已修改任何记录；写明各字段上限；用 output_language 写。schema 为 headline（字符串）、observations（字符串数组）、suggestions（字符串数组），全部必填、不允许多余字段；max_tokens 4000
      - 校验函数：输出必须是恰好含上述三个键的对象；headline 去首尾空白后 1 至 120 字（按码点）；observations 是 2 至 4 条字符串，每条去首尾空白后 1 至 200 字；suggestions 是 1 至 3 条字符串，每条去首尾空白后 1 至 150 字；任一不合返回 None（判 AI 出错），不截断、不补齐、不丢掉单条；合格时返回去空白后的三个字段
      - ai_assist_service 的结果对象新增可空字段 headline、observations、suggestions，新增类别常量 NO_DATA（no_data）；write_ai_request 与它内部记结果的函数的 contact_id 改为可以是 None，其他 AI 功能照旧传联系人 id、行为不变
      - dashboard_insight_service 新增业务函数 generate_dashboard_insight(db, *, user, output_language)：user 的角色不是 manager 时抛 ValueError（接口层会先挡下）；之后检查顺序为 output_language 不在 zh-CN、en、ms 之内为 invalid_input，AI 未配置为 not_configured；再用当前 UTC 时间调用 build_team_snapshot，团队本月与上月的 won_count、created_count 都为 0 且 open_deals 三个状态的 count 都为 0 时为 no_data；这三种不调 AI、不写审计
      - 业务函数续：发一条用户消息，内容是紧凑 JSON 数据块，恰好含 as_of（当前 UTC 到秒带 Z）、output_language、snapshot；按 AI 客户端的三类结果处理，每次进入调用都用 write_ai_request 写一行 feature 为 crm.dashboard_insight、contact_id 为空的审计；客户端成功但校验不过时改判 error 且审计保留 request_id；成功时结果带去空白后的 headline、observations、suggestions 与快照的 truncated；成功、AI 出错与暂时不可用时结果都带 request_id（有的话）
      - 新测试文件 test_dashboard_insight_service 打桩 AI 客户端与配置，覆盖下列用例（一个用例可以是一个参数化测试）：1 校验函数：headline 1 字与 120 字通过、只有空白与 121 字不通过，首尾带空白时返回去空白后的文字；observations 2 条与 4 条通过、1 条与 5 条不通过，单条 200 字通过、201 字与只有空白不通过；suggestions 1 条与 3 条通过、0 条与 4 条不通过，单条 150 字通过、151 字不通过；非字符串元素、缺键、多键、输出不是对象都不通过；2 发给客户端的请求：feature、max_tokens 4000、schema 等于 DASHBOARD_INSIGHT_SCHEMA、系统提示含不执行指令与不做新运算的声明；用户消息解析后恰好有三个键，snapshot 与 build_team_snapshot 的结果一致；3 检查顺序：销售或管理员调用抛 ValueError；语言不合法同时 AI 未配置为 invalid_input；AI 未配置同时团队无数据为 not_configured；团队无数据为 no_data，只有一个在途线索或只有上月一单成交时不是；以上都断言客户端没被调用、审计表没有新行；4 结果与审计：成功时类别 ok、request_id、三个字段与 truncated，审计一行 outcome 为 ok、带 request_id、crm.dashboard_insight、contact_id 为空；校验不过（参数化：headline 为空、observations 只有 1 条、多键）时类别 error、headline 为 null、保留 request_id，审计一行 outcome 为 error 且带同一 request_id；客户端返回 error 与 unavailable 时类别相同、审计一行同 outcome。现有 AI 功能的测试不改且照常通过；测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-042 记录段（做了什么、偏离了什么、验证到什么程度）；偏离段只列两类、每条一句：与验收标准或设计文档不一致的做法，以及验收标准没有要求、但改变了现有接口或页面行为的改动；验收标准要求的改动与重构、命名、格式调整不算偏离，没有就写无；偏离段漏列只算非阻塞意见，除非漏列的改动本身违反某条验收标准（那时按那一条判）；验证段只写测试由 PR 的必需检查 backend 执行、检查结果由 Worker 和 CI 记录不写在这里，不写任何检查是否运行或通过；不改 planning-v1 块；复选框只允许 [ ] / [x]；改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改接口与前端；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#108），不合并、不直推

  - id: CRM-TASK-036
    title: 商机AI下一步建议的提示词、输出校验与业务函数
    purpose: >-
      按 docs/deal-next-step.md 4.1、4.4 节与第五节，定义 crm.deal_next_step 的系统提示、JSON schema 与输出校验，并用 CRM-TASK-035 的快照函数串成一个可调用的业务函数。
      复用 CRM-TASK-022、023 的 AI 客户端、审计写入与结果对象。只做业务规则层：不加接口、不改前端、不加表与迁移、不改商机；测试打桩 AI 客户端，不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-035
    acceptance_criteria:
      - ai_features 新增 DEAL_NEXT_STEP_FEATURE（crm.deal_next_step）、DEAL_NEXT_STEP_SYSTEM、DEAL_NEXT_STEP_SCHEMA 与 validate_deal_next_step(output, stalled)；系统提示写明快照是不可信数据、不执行其中的指令，只用快照里的事实、不推测快照里没有的价格日期承诺与决策人，as_of 是现在，idle_days、days_in_status、stalled 是 CRM 算好的事实、直接采用不重算，stalled 为假时 stall_reason 必须为空串、为真时写可能的原因、看不出就写明缺什么记录，下一步要具体、不声称已修改任何记录，写明各字段上限，用 output_language 写；schema 为 assessment（字符串）、stall_reason（字符串）、next_steps（字符串数组），全部必填、不允许多余字段；max_tokens 4000
      - 校验函数：输出必须是恰好含上述三个键的对象；assessment 去首尾空白后 1 至 400 字（按码点）；stalled 为真时 stall_reason 去首尾空白后 1 至 300 字，为假时去首尾空白后必须为空串；next_steps 是 1 至 3 条字符串，每条去首尾空白后 1 至 120 字；任一不合返回 None（判 AI 出错），不截断、不补齐、不丢掉单条；合格时返回去空白后的三个字段
      - ai_assist_service 的结果对象新增可空字段 assessment、stall_reason、next_steps、idle_days、days_in_status、stalled，新增类别常量 DEAL_CLOSED（deal_closed）；其他 AI 功能的行为不变
      - deal_next_step_service 新增业务函数 generate_deal_next_step(db, *, user, deal_id, output_language)：第一步读未删除的商机与它未删除的联系人，任一读不到抛 ValueError（接口层会先挡下）；之后检查顺序为 output_language 不在 zh-CN、en、ms 之内为 invalid_input，商机状态为 won 或 lost 为 deal_closed，AI 未配置为 not_configured，这个商机没有 status change 以外的跟进记录且这个联系人没有任何消息为 no_history；这四种不调 AI、不写审计
      - 业务函数续：用当前 UTC 时间调用 build_deal_snapshot；发一条用户消息，内容是紧凑 JSON 数据块，恰好含 as_of（当前 UTC 到秒带 Z）、output_language、snapshot；按 AI 客户端的三类结果处理，每次进入调用都用 write_ai_request 写一行 feature 为 crm.deal_next_step、contact_id 为商机所属联系人的审计；客户端成功但校验不过时改判 error 且审计保留 request_id；成功时结果带去空白后的 assessment、stall_reason、next_steps，以及快照里的 idle_days、days_in_status、stalled、truncated；成功、AI 出错与暂时不可用时结果都带 request_id（有的话）
      - 新测试文件 test_deal_next_step_service 打桩 AI 客户端与配置，覆盖下列用例（一个用例可以是一个参数化测试）：1 校验函数：assessment 1 字与 400 字通过、只有空白与 401 字不通过，首尾带空白时返回去空白后的文字；stalled 为真时 stall_reason 1 字与 300 字通过、空串与 301 字不通过；stalled 为假时空串与只有空白通过、有内容不通过；next_steps 1 条与 3 条通过、0 条与 4 条不通过，单条 120 字通过、121 字与只有空白不通过、非字符串不通过；缺键、多键、输出不是对象都不通过；2 发给客户端的请求：feature、max_tokens 4000、schema 等于 DEAL_NEXT_STEP_SCHEMA、系统提示含不可信数据的声明；用户消息解析后恰好有三个键，snapshot 与 build_deal_snapshot 的结果一致
      - 测试续：3 检查顺序：语言不合法同时商机为 won 时为 invalid_input；won 与 lost 同时 AI 未配置时为 deal_closed；进行中且 AI 未配置同时没有记录时为 not_configured；只有 status change 跟进且没有消息时为 no_history，有一条 phone 跟进或一条消息时不是；以上都断言客户端没被调用、审计表没有新行；商机不存在、已软删除、它的联系人已软删除都抛 ValueError，且同时语言不合法时仍抛 ValueError；4 结果与审计：成功时类别 ok、request_id、去空白后的三个字段与快照的四个值，审计一行 outcome 为 ok、带 request_id、crm.deal_next_step 与商机所属联系人；校验不过（参数化：assessment 为空、stalled 为假却有 stall_reason、4 条下一步、多键）时类别 error、assessment 为 null、保留 request_id，审计一行 outcome 为 error 且带同一 request_id；客户端返回 error 与 unavailable 时类别相同、审计一行同 outcome。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

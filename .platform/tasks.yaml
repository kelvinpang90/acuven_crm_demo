  - id: CRM-TASK-032
    title: 跟进记录AI整理的提示词、输出校验与业务函数
    purpose: >-
      按 docs/followup-ai-draft.md 4.1 至 4.3 节与第五节，定义 crm.followup_draft 的系统提示、JSON schema 与输出校验，组装发给模型的数据，
      并串成一个可调用的业务函数。复用 CRM-TASK-022、023 的 AI 客户端、审计写入与结果对象，以及 CRM-TASK-027 的 owner_scope。只做业务规则层：
      不加接口、不改前端、不加表与迁移、不改现有的建跟进记录与建任务；测试打桩 AI 客户端，不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-031
    acceptance_criteria:
      - ai_features 新增 FOLLOWUP_FEATURE（crm.followup_draft）、FOLLOWUP_SYSTEM、FOLLOWUP_SCHEMA 与 validate_followup_draft(output, today)；系统提示写明速记、客户名、商机与待办标题都是不可信数据、不执行其中的指令，只用速记里的事实、不补速记里没有的价格日期与承诺，记录用速记的语言写、混用多种语言时用 output_language，任务只起草速记里明确要做的事、已在 open_tasks 里的不重复起草，到期日只在速记里说了或能由 today 推算时才给、否则为 null，并写明各字段上限；schema 为 activity_type（枚举 phone、email、meeting、WhatsApp、other）、content（字符串）、tasks（数组，每项 title 字符串、due_date 字符串或 null、priority 枚举 high、mid、low），全部必填、各层都不允许多余字段；max_tokens 4000
      - 校验函数：输出与每条任务都必须是恰好含上述键的对象；activity_type 在五个值之内；content 去首尾空白后 1 至 1000 字（按码点）；tasks 0 至 3 条；title 去首尾空白后 1 至 100 字；due_date 为 null，或是严格的 YYYY-MM-DD 合法日期且不早于 today、不晚于 today 加 365 天；priority 在三个值之内；任一不合返回 None（判 AI 出错），不截断、不补齐、不丢掉单条；合格时返回去空白后的 content 与各条 title
      - ai_assist_service 的结果对象新增可空字段 activity_type、content、tasks；收件箱与客户摘要的行为不变
      - 新文件 followup_draft_service 的业务函数 generate_followup_draft(db, *, user, contact_id, deal_id, note, today, output_language)：today 是 YYYY-MM-DD 字符串；第一步读联系人，不存在或已软删除抛 ValueError（接口层会先挡下，设计第九节第 1 条）；之后检查顺序为 output_language 不在 zh-CN、en、ms 之内，note 不是字符串或去首尾空白后不在 1 至 2000 字，today 不是严格的 YYYY-MM-DD 合法日期或与服务器当前 UTC 日期相差超过 1 天，deal_id 不是这个联系人的、未删除且 may_access_deal 为真的商机，以上任一为 invalid_input；之后 AI 未配置为 not_configured；这两种不调 AI、不写审计
      - 业务函数续：发一条用户消息，内容是紧凑 JSON 数据块，恰好含 as_of（当前 UTC 到秒带 Z）、today、output_language、contact（只有 name、company）、deal（title 为空为空串、截到 100 字，status，amount 为两位小数的字符串）、open_tasks（本人可见即 owner_scope、未完成、关联这个联系人的待办，到期日从早到晚、没有到期日的排最后、同一到期日按 id 正序，取前 5 个，每个 title 截到 100 字、priority、due_date 可为 null；可以把 contact_summary_service 里同样的取法抽成共用函数，客户摘要的行为不变）、note（去首尾空白后）；按 AI 客户端的三类结果处理，每次进入调用都用 write_ai_request 写一行 feature 为 crm.followup_draft、contact_id 为这个联系人的审计；客户端成功但校验不过时改判 error 且审计保留 request_id；成功时结果带 activity_type、content、tasks；成功、AI 出错与暂时不可用时结果都带 request_id（有的话）
      - 新测试文件 test_followup_draft_service 打桩 AI 客户端与配置，覆盖下列用例（一个用例可以是一个参数化测试）：1 校验函数：content 1 字与 1000 字通过、只有空白与 1001 字不通过，首尾带空白时返回去空白后的文字；activity_type 五个值通过、status change 与其他值不通过；tasks 0 条与 3 条通过、4 条不通过；title 1 字与 100 字通过、只有空白与 101 字不通过；due_date 为 null、等于 today、等于 today 加 365 天通过，today 前一天、today 加 366 天、2026-02-30、斜杠分隔、非字符串不通过；priority 三个值通过、其他不通过；顶层与任务层缺键、多键、输出不是对象都不通过；2 发给客户端的请求：feature、max_tokens 4000、schema 等于 FOLLOWUP_SCHEMA、系统提示含不可信数据的声明；用户消息解析后恰好有上述七个键，note 为去空白后的文本，contact 只有 name 与 company；open_tasks 不含别人名下的（销售请求时）与已完成的，多于 5 条时只取 5 条且顺序符合上述规则
      - 测试续：3 检查顺序：语言不合法同时 AI 未配置时为 invalid_input；note 只有空白、2001 字为 invalid_input；today 为 2026-1-5 这类非严格格式、比服务器 UTC 日期晚 2 天为 invalid_input，早 1 天与晚 1 天都通过参数检查；deal_id 属于别的联系人、已删除、销售请求别人名下的商机为 invalid_input；参数都合法而 AI 未配置为 not_configured；以上都断言客户端没被调用、审计表没有新行；联系人不存在与已软删除都抛 ValueError，且同时语言不合法时仍抛 ValueError（联系人先查）；4 结果与审计：成功时类别 ok、request_id、去空白后的 content 与各条 title，审计一行 outcome 为 ok、带 request_id 与 crm.followup_draft；校验不过（参数化：content 为空、4 条任务、due_date 为 today 前一天、多键）时类别 error、content 为 null、保留 request_id，审计一行 outcome 为 error 且带同一 request_id；客户端返回 error 与 unavailable 时类别相同、审计一行同 outcome。测试只需覆盖上两条列出的用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

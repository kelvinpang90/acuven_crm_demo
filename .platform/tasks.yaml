  - id: CRM-TASK-008
    title: 新增会话事件接收接口与签名校验
    purpose: >-
      按 docs/chatbot-events.md 第四节加内部接口：路由前缀 internal 下的 chatbot events，只在 Docker 内网可达。
      验签、校验请求体、调 CRM-TASK-007 的事件处理服务、按约定返回状态码；消息接口返回新字段；联系人详情对管理员查询号码冲突。
      不改业务规则、不改表结构、不改 nginx 与部署配置、不改前端；不动旧的网关内部接口与 Meta webhook（第 2 阶段删）。
    status: ready
    depends_on:
      - CRM-TASK-007
    acceptance_criteria:
      - 新增 POST 接口，路径为 internal 前缀下的 chatbot/events，与现有 internal whatsapp 路由一样不加 api 前缀；一次请求一个事件
      - 验签按设计第四节：请求头 X-Acuven-Timestamp（Unix 秒）与 X-Acuven-Signature（sha256= 加十六进制），签名是 HMAC-SHA256 作用于时间戳、一个点号与原始请求体字节；新增配置 chatbot_events_secret 与 chatbot_events_secret_previous，任一把验过即可，常数时间比较；时间戳与当前时间相差超过 300 秒、签名缺失或不符返回 401；两把都未配置返回 503，且不处理请求体
      - 请求体按设计第四节校验：type 只接受五种，visitor 的 phone 与 bsuid 至少一个非空，各类型的附加字段齐全，occurred_at 是带时区的时间；不合法返回 422；合法则调事件处理服务，返回 200 与 result（stored、duplicate 或 ignored）
      - 消息列表与单个会话接口返回 author_kind、bot_id、delivery_status、delivery_error；联系人详情接口在调用方是管理员时请求号码冲突查询，其他角色不查
      - 新增测试覆盖：签名正确返回 200 并入库；用旧密钥签名也通过；签名错误、时间戳过期、缺签名头返回 401；未配置密钥返回 503 且不入库；请求体不合法返回 422；重复投递返回 duplicate；消息接口带新字段；非管理员的联系人详情 phone_conflict 为 false；每条测试写明守住哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-008 记录段（做了什么、偏离了什么、验证到什么程度），不改 planning-v1 块，复选框只允许 [ ] / [x]

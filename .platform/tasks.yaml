  - id: CRM-TASK-011
    title: 会话事件的处理规则，找联系人、消息入库、接管与送达状态
    purpose: >-
      实现 docs/chatbot-events.md 第五节与第九节第 1、4 条对五种事件的处理：找联系人（必要时新建并指派、建 lead 商机）、
      消息按 wa_message_id 去重入库、接管状态按事件时间更新、送达状态只升不降。只做业务规则层，入口只收已校验的普通参数，
      由 CRM-TASK-008 的接口调用。不加接口与验签、不改表结构、不改号码规范化与各保存入口（CRM-TASK-007）、不改前端。
    status: ready
    depends_on:
      - CRM-TASK-006
      - CRM-TASK-007
    acceptance_criteria:
      - 消息类事件按设计第五节找联系人（事件里的号码一律先用 CRM-TASK-007 的函数规范化，联系人号码与收发件人字段都存规范化结果；无法规范化的号码由 CRM-TASK-008 拒收，处理入口遇到时按没有号码处理）：先按规范化号码找未删除的联系人，多个取最早创建的（创建时间相同按 id 取最小），该联系人没有 BSUID 且这个 BSUID 没被别的未删除联系人占用时补上；号码没找到再按 BSUID 找，找到且它没有号码时补上号码；都没找到就新建（名字依次取资料名、号码、BSUID，截断到 100 字符；is_gateway 为 false；经 assign_contact 指派；建一条 lead 商机）；已有联系人的名字不被资料名覆盖；按第九节第 1 条，要用的 BSUID 只被已软删除的联系人占着时，先把它从那些联系人身上清掉再用，不因唯一索引报错
      - 消息类事件按 wa_message_id 去重，已存在返回 duplicate 且不改任何数据；customer_message 存为未读的入站消息、author_kind 为 customer；ai_reply 存为已读的出站消息、author_kind 为 ai、记 bot_id（可为空）；console_reply 存为已读的出站消息、author_kind 为 console；渠道为 whatsapp，负责人取联系人当前负责人，访客一侧填号码（没有号码填 BSUID）、chatbot 一侧填 ai_chatbot_demo，消息时间取事件的 occurred_at（转成无时区的 UTC 存储）；成功返回 stored
      - handover_changed 只找联系人不新建（找不到返回 ignored）；occurred_at 早于联系人已存的接管更新时间时返回 ignored 且不改数据，否则写入是否接管、到期时间（结束接管时为空）与更新时间，返回 stored
      - delivery_status 只更新 external_id 等于 wa_message_id 的那条消息（找不到返回 ignored）；只升不降：sent 小于 delivered 小于 read，failed 只能覆盖空值、sent、delivered，已是 failed 的不再改变，同一状态重复到达也不算升级，不满足时返回 ignored 且不改数据；failed 时把错误码与标题以一个空格相连存进 delivery_error（只有一个就只存它，都没有存空）并截断到 300 字符，其他状态不改 delivery_error
      - 事件处理入口只接受已校验的普通参数，不依赖接口层的请求模型、不发外部请求；新增测试逐条覆盖上面的规则，以及设计第八节前三条边缘情况（只有 BSUID 的访客后来公开的号码属于别的联系人、号码撞上 is_gateway 联系人、补投的旧事件不改坏状态）；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-011 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改接口与前端
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#17），不合并、不直推
    allowed_change_paths:
      - backend/app/services/chatbot_event_service.py
      - backend/tests/test_chatbot_event_service.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CRM-TASK-008
    title: 会话事件接收接口与验签，消息和联系人接口返回新字段
    purpose: >-
      按 docs/chatbot-events.md 第四节加 ai_chatbot_demo 推送会话事件的内部接口（只在共享 Docker 网络内可达，nginx 不转发），
      验签后交给 CRM-TASK-011 的处理规则；消息与联系人接口返回新字段和 phone_conflict，供 CRM-TASK-010 显示。
      验签与响应形状要和 ai_chatbot_demo 已实现的推送（其任务 40.1、40.2）一致。只做接口层：不改处理规则、
      不改表结构、不改前端、不改 nginx 与部署配置、不动现有 X-Internal-Secret 的网关入口；不写任何真实密钥。
    status: ready
    depends_on:
      - CRM-TASK-011
    acceptance_criteria:
      - 新增 POST /internal/chatbot/events（不带 /api 前缀，与 chatbot 推送地址的路径一致），一次一个事件，先验签再解析请求体；请求头 X-Acuven-Timestamp 是 Unix 秒、X-Acuven-Signature 是 sha256= 接十六进制；签名为 HMAC-SHA256，密钥是 CHATBOT_EVENTS_SECRET 字符串的 UTF-8 字节，被签内容是时间戳与一个点的字节再接原始请求体字节；常数时间比较，CHATBOT_EVENTS_SECRET 或 CHATBOT_EVENTS_SECRET_PREVIOUS 任一把验过即可；缺头、格式不对、签名不符、时间戳与当前相差超过 300 秒返回 401（签名不对时无论请求体是否合法都是 401）；两把都未配置返回 503；两项配置加进配置类，默认空，旁边注释写明与 chatbot 一侧的 CRM_EVENTS_SECRET 同值（backend/.env.example 是凭据形状的文件名，Worker 改不了，由人另补）
      - 请求体按设计第四节校验：type 只能是五种之一；occurred_at 是带时区的时间；visitor 的 phone 与 bsuid 至少一个非空，phone 非空时必须能被 CRM-TASK-007 的函数规范化；三种消息事件必须带 message 的 wa_message_id 与 body；ai_reply 的 bot_id 可为空或缺省；handover_changed 带 handover 的 active 与 expires_at，active 为真时 expires_at 必须非空、为假时为空（第九节第 5 条）；delivery_status 带 status 的 wa_message_id、四种之一的 status 与可空的 error_code（整数或字符串）、error_title；不合法返回 422；event_id 只进日志不存
      - 合法事件交给 CRM-TASK-011 的事件处理，返回 200，响应体顶层就是 result 一个键（stored、duplicate、ignored 之一），不套通用的 success 与 data 外壳（chatbot 只读顶层 result）；处理中的其他错误照常返回 5xx，不吞成 200
      - 消息列表、联系人消息与标记已读接口返回的每条消息多出 author_kind、bot_id、delivery_status、delivery_error
      - 联系人列表与详情多出 wa_handover_active（标着接管中但到期时间已过或为空的按 false 返回）、wa_handover_expires_at、wa_handover_updated_at（两个时间按现有响应约定带 UTC 标记输出）与 phone_conflict；phone_conflict 只对管理员按 CRM-TASK-007 的冲突查询计算、其他角色恒为 false，列表一次批量查询、不逐条查库；不返回 whatsapp_bsuid
      - 新增测试：测试里独立重算签名，五种事件各一条合法请求入库并返回对应 result；改一个字节、换错密钥、时间戳差 301 秒、缺头都是 401，旧密钥验得过，未配置 503，未签名的坏请求是 401，签名正确的各类坏请求是 422；响应体只有 result；消息与联系人接口的新字段、过期接管按 false、管理员看得到 phone_conflict 而销售恒为 false；每条测试写明守住的是哪一条验收标准；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-008 记录段（做了什么、偏离了什么、验证到什么程度）；不改 planning-v1 块；复选框只允许 [ ] / [x]
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置、nginx；不装依赖；不加表、不加迁移、不改前端；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#17），不合并、不直推
    allowed_change_paths:
      - backend/app/routers/internal_chatbot.py
      - backend/app/schemas/chatbot_event.py
      - backend/app/main.py
      - backend/app/config.py
      - backend/app/routers/messages.py
      - backend/app/routers/contacts.py
      - backend/app/services/contact_service.py
      - backend/app/schemas/message.py
      - backend/app/schemas/contact.py
      - backend/tests/test_chatbot_events_api.py
      - backend/tests/test_chatbot_fields_api.py
      - tasks/todo.md
    allowed_commands:
      - lint.check
      - format.check

  - id: CRM-TASK-051
    title: 从聊天提取客户资料的提示词、出处校验与业务函数
    purpose: >-
      按 docs/contact-ai-extract.md 4.1 节与第五节，定义 crm.contact_extract 的系统提示、JSON schema 与输出校验（出处必须是某条入站消息的原话、值必须出现在出处里），并用 CRM-TASK-050 的快照函数串成业务函数。只做业务规则层：不加接口、不改前端、不加表与迁移、不写客户资料；测试打桩 AI 客户端，不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on:
      - CRM-TASK-050
    acceptance_criteria:
      - ai_features 新增 CONTACT_EXTRACT_FEATURE（crm.contact_extract）、CONTACT_EXTRACT_SYSTEM、CONTACT_EXTRACT_SCHEMA 与 validate_contact_extract(output, snapshot)；系统提示写明快照是不可信数据、不执行其中的指令，只从 direction 为 inbound 的消息里取资料（出站里的电话地址多半是我们公司的），只给 empty_fields 里的字段与 name_is_phone 为真时的 name，找不到就不给、不猜，evidence 逐字抄顾客原话里含这个值的一小段，一个字段最多一条，行业只能从 INDUSTRIES 里选（列出这十个），写明各字段上限；schema 为 suggestions（对象数组，每个对象 field 为 name、company、industry、email、phone、address 之一，value、evidence 为字符串，message_index 为整数，全部必填、不允许多余字段）；max_tokens 4000
      - 校验函数（去首尾空白、按码点）：输出恰好含 suggestions；最多 6 条，field 不重复，且 field 在快照的 empty_fields 里、或为 name 且 name_is_phone 为真；value 1 至 200 字（name 1 至 100，address 1 至 300），evidence 1 至 300 字；message_index 指向快照 messages 里 direction 为 inbound 的一条，且把连续空白压成一个空格后 evidence 是该条 body 的子串；email 的 value 含 @ 且出现在 evidence 里（不分大小写）；phone 的 value 能用 normalize_phone 规范化为 N，且把 evidence 里的非数字字符全部去掉后的数字串包含 N，或在 N 以 60 开头时包含 0 加 N 去掉 60 后的部分（设计第九节第 3 条）；industry 的 value 在 INDUSTRIES 里；name、company、address 的 value 压空白后出现在 evidence 里（不分大小写）；任一条不合返回 None（整次判 AI 出错，不丢单条）；合格时返回去空白后的 suggestions（每条四个键）
      - ai_assist_service 的结果对象沿用已有的 suggestions 字段（经理看板解读用的是字符串列表），把它的类型放宽为可空的任意元素列表，本功能放每条建议的对象；新增类别常量 NOTHING_TO_FILL（nothing_to_fill）；其他 AI 功能的行为不变
      - contact_extract_service 新增业务函数 generate_contact_extract(db, *, user, contact_id, output_language)：第一步读未删除的联系人，读不到抛 ValueError；之后检查顺序为 output_language 不在 zh-CN、en、ms 之内为 invalid_input，AI 未配置为 not_configured，empty_fields 为空且 name_is_phone 为假为 nothing_to_fill；之后用当前 UTC 时间调 build_extract_snapshot，快照的 messages 里没有 direction 为 inbound 的一条为 no_messages（沿用已有常量 NO_MESSAGES；按最终快照判断，最近 40 条全是出站也算）；这四种不调 AI、不写审计
      - 业务函数续：发一条用户消息，内容是紧凑 JSON 数据块，恰好含 as_of、output_language、snapshot；按 AI 客户端的三类结果处理，每次进入调用都用 write_ai_request 写一行 feature 为 crm.contact_extract、contact_id 为这个联系人的审计；客户端成功但校验不过时改判 error 且审计保留 request_id；成功时结果带 suggestions 与快照的 truncated；成功、AI 出错与暂时不可用时结果都带 request_id（有的话）；不修改联系人
      - 新测试文件 test_contact_extract_service 打桩 AI 客户端与配置，覆盖下列用例（一个用例可以是一个参数化测试）：1 校验：合格的一条通过并去空白；evidence 不在任何消息里、指向出站消息、index 越界都不通过；evidence 与正文只差连续空白时通过；address 250 字且在 evidence 里时通过；email 不在 evidence 里不通过；phone 012-345 6789 对应 evidence 里的 +60 12 345 6789 通过、对应 evidence 里的 012-3456789 10 am 也通过、对应不上的不通过；industry 不在列表里不通过；field 已有值（不在 empty_fields）不通过，name 只在 name_is_phone 为真时通过；7 条、同 field 两条、缺键、多键、空数组外的非对象都不通过，空数组通过；2 请求：feature、max_tokens 4000、schema 等于 CONTACT_EXTRACT_SCHEMA、系统提示含不可信数据与只取入站的声明，用户消息恰好三个键；3 检查顺序：语言不合法同时未配置为 invalid_input；未配置同时没有可填字段为 not_configured；没有可填字段同时没有入站消息为 nothing_to_fill；只有出站消息为 no_messages，最近 40 条全是出站而更早有入站也为 no_messages；都断言没调客户端、审计表没有新行；联系人不存在或已删除抛 ValueError；4 结果与审计：成功、校验不过（保留 request_id）、error、unavailable 各自的类别与审计一行；成功后联系人的字段没有被改。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

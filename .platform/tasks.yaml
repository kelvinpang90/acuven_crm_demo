      - 消息类事件按 wa_message_id 去重，已存在返回 duplicate 且不改任何数据；customer_message 存为未读的入站消息、author_kind 为 customer；ai_reply 存为已读的出站消息、author_kind 为 ai、记 bot_id（可为空）；console_reply 存为已读的出站消息、author_kind 为 console；渠道为 whatsapp，负责人取联系人当前负责人，访客一侧填号码（没有号码填 BSUID）、chatbot 一侧填 ai_chatbot_demo，消息时间取事件的 occurred_at（转成无时区的 UTC 存储）；成功返回 stored

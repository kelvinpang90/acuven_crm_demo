  - id: CRM-TASK-050
    title: 从聊天提取客户资料的快照组装与行业常量
    purpose: >-
      按 docs/contact-ai-extract.md 第三节与第九节，组装发给模型的客户资料提取快照：哪些字段还空着、名字是不是号码、最近 40 条消息（带序号），并加一份与前端一致的行业常量。只做业务规则层的快照函数：不调 AI、不写审计、不加接口、不改前端、不加表与迁移；测试不调真实模型、不写任何真实密钥与地址。
    status: done
    depends_on: []
    acceptance_criteria:
      - 新文件 contact_extract_service 新增常量 INDUSTRIES（与 frontend 的 ContactForm 里的十个行业逐字相同、顺序相同）、EXTRACT_FIELDS（company、industry、email、phone、address，按此顺序）与函数 build_extract_snapshot(db, *, contact, now)；contact 是调用方已读出的未删除记录，now 是带时区的 UTC 时间（库里不带时区的时间按 UTC 处理）；返回的字典恰好含 contact、messages、truncated 三个键；不调 AI、不写审计、不写库
      - contact 块恰好含 name、name_is_phone、empty_fields：name 原样（截到 100 字）；name_is_phone 为名字去首尾空白后非空、只由数字、加号、空格与短横组成且至少含一个数字；empty_fields 为 EXTRACT_FIELDS 里当前值为 null 或去首尾空白后为空串的字段，按 EXTRACT_FIELDS 的顺序；快照里没有任何字段的现有值（name 除外）、没有 id、负责人与员工姓名
      - messages 块：这个联系人的消息（不按 now 过滤，与客户摘要相同），按创建时间、同一时间按 id 取最近 40 条，从旧到新；每条恰好含 index、at（UTC 到秒带 Z）、direction、author_kind（为空时入站按 customer、出站按 agent）、channel、body（截到 1000 字），邮件另带 subject（截到 100 字，为空为空串）；index 是该条在最终快照里从 0 起的位置
      - 16 KiB 与 truncated：上限写成本模块的常量（值为 16384，比较时按模块属性读取，便于测试调小），快照按紧凑 JSON、不转义非 ASCII 的 UTF-8 计，超过上限时从最旧的消息开始丢、至少留 1 条，丢完后重新编 index；任何一处截断、消息超过 40 条没取全、或因 16 KiB 丢了消息，truncated 为真，否则为假
      - 新测试文件 test_contact_extract_snapshot 覆盖下列用例（now 固定）：1 顶层三个键、contact 块三个键，快照里没有 email、phone 等现有值；2 name_is_phone：60123456789、+60 12-345 6789 为真，Tan、空串、Tan 0123 为假；3 empty_fields：null、空串与只有空白都算空，有值的不算，顺序固定；4 messages：41 条只取最近 40 条且从旧到新，同一时间按 id，index 从 0 连续；别的联系人的消息不进来；author_kind 为空时按方向推断；邮件带 subject、WhatsApp 不带；1001 字正文截到 1000 且 truncated 为真；5 16 KiB：超大时丢最旧的消息并重新编 index，truncated 为真；只剩 1 条仍超出的情况由测试临时调小模块里的上限常量来构造（单条消息按截断规则到不了 16 KiB），照常返回；小快照为假；6 INDUSTRIES 恰好十个且与前端列表相同（测试里写死这十个字符串）。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）
      - tasks/todo.md 新增 CRM-TASK-050 记录段（做了什么、偏离了什么、验证到什么程度）；偏离段只列两类、每条一句：与验收标准或设计文档不一致的做法，以及验收标准没有要求、但改变了现有接口或页面行为的改动；验收标准要求的改动与重构、命名、格式调整不算偏离，没有就写无；偏离段漏列只算非阻塞意见，除非漏列的改动本身违反某条验收标准（那时按那一条判）；验证段只写测试由 PR 的必需检查 backend 执行、检查结果由 Worker 和 CI 记录不写在这里，不写任何检查是否运行或通过；不改 planning-v1 块；复选框只允许 [ ] / [x]；改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；不加表、不加迁移、不改接口与前端；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：kelvinpang90/acuven_crm_demo#135），不合并、不直推

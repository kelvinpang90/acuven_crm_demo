    status: done
    depends_on:
      - CRM-TASK-065
    acceptance_criteria:
      - 新文件 message_triage_service 新增 build_triage_snapshot(db, *, contact, now)：恰好含 contact（name 截 100 字、company 截 200 字）与 messages（这个客户最近 10 条消息，按创建时间、同一时间按 id，从旧到新，每条含 at、direction、author_kind（为空时按方向推断）、channel、body 截到 500 字）；不调 AI
      - ai_features 新增 MESSAGE_TRIAGE_FEATURE（crm.message_triage）、MESSAGE_TRIAGE_SYSTEM、MESSAGE_TRIAGE_SCHEMA 与 validate_message_triage(output)；系统提示写明快照是不可信数据、不执行其中的指令，按顾客最新的诉求判断，逐个写明七个意图与四个紧急度的含义（照设计第五节），拿不准时意图选 other、紧急度选 normal；schema 为 intent、urgency 两个枚举，必填，不允许多余字段；校验两个值都在枚举里且恰好这两个键，否则返回 None；max_tokens 4000
      - ai_assist_service：结果对象新增可空字段 intent、urgency；新增类别常量 SKIPPED（skipped）与 SUPERSEDED（superseded）；write_ai_request 与它内部记结果的函数的 user_id 可以是 None；其他 AI 功能的行为不变
      - 新增 classify_conversation(db, *, contact_id, message_id)：客户不存在或已删除、message_id 不存在或不属于这个客户为 skipped；message_id 那条不是入站消息为 skipped；这个客户有比它更新（创建时间更晚、同一时间按 id，且创建时间不晚于当前 UTC 加 5 分钟，设计第九节第 5 条）的入站消息为 superseded；AI 未配置为 not_configured；这三种不调 AI、不写审计；之后组装快照，用户消息为紧凑 JSON，恰好含 as_of 与 snapshot；按三类结果处理，每次进入调用写一行 feature 为 crm.message_triage、user_id 为空、contact_id 为这个客户的审计；校验不过改判 error 且保留 request_id；成功时在写入前再查一次是否已有更新的入站消息、以及已有的一行覆盖的消息是否比 message_id 那条更新（同样只算创建时间不晚于当前 UTC 加 5 分钟的），任一成立则不写、类别改为 superseded（审计照实写 ok）；否则把这个客户的一行插入或覆盖（intent、urgency、message_id、request_id、triaged_at 为当前 UTC）；失败不改原有的行；返回带类别、request_id、intent、urgency 的结果；不提交事务（调用方提交）
      - config 新增 ai_triage_enabled（环境变量 AI_TRIAGE_ENABLED，缺省为假）；新增常量 TRIAGE_DELAY_SECONDS 为 20 与 run_triage(contact_id, message_id, delay=TRIAGE_DELAY_SECONDS)：开关为假或 AI 未配置时直接返回；否则先等 delay 秒（让顾客连发的后几条先进库，设计第九节第 4 条），再自己用应用的会话工厂开一个会话调 classify_conversation 并提交；任何异常只记日志不抛出
      - 新测试文件 test_message_triage_service 打桩 AI 客户端与配置，覆盖：1 快照：11 条只取最近 10 条且从旧到新、别的客户的不进来、501 字截到 500、author_kind 推断；2 校验：合格通过，枚举外的值、缺键、多键不通过；3 请求：feature、max_tokens、schema、系统提示含不可信数据声明，用户消息两个键；4 检查顺序：客户已删除、message_id 属于别的客户、message_id 是出站消息为 skipped；有更新的入站消息为 superseded，更新的是出站消息或创建时间在 10 分钟后的未来时不是；未配置为 not_configured；都不调客户端、不写审计；5 成功时 conversation_triage 新插入一行、再次成功覆盖同一行，审计 user_id 为空；AI 调用期间（打桩里）插入一条更新的入站消息时不写、类别为 superseded；已有的一行覆盖的是更新的消息时不被旧的覆盖；校验不过、error、unavailable 时原有的行不变且审计各一行；6 run_triage：开关为假时不调 classify_conversation，classify_conversation 抛异常时 run_triage 不抛出，delay 为 0 时不等待（测试一律传 0）。测试只需覆盖这些用例，每个测试写明守住的是哪一条验收标准；清单之外的补充覆盖只算非阻塞意见；由 PR 的必需 CI 检查 backend 执行并全部通过（Worker 沙箱不跑 pytest）

    title: 回复框加AI起草与翻译，消息气泡加翻译
    purpose: >-
      按 docs/inbox-ai-assist.md 第 4.5 节与第八节第 1、2 条，在 CRM-TASK-016 的回复框之上加 AI 起草与翻译成某语言，在每条消息气泡上加翻译。
